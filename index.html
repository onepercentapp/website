<body>

<a class="skip" href="#main">Skip to content</a>

<!--
  No site header on this page, unlike every other one.

  The header exists so a reader deep inside the privacy policy can get back to
  the start. Here it would be a link to the page it is already on, sitting above
  a wordmark that is the first thing in the composition anyway — so the mark
  moves into the hero and the bar goes away. That is most of what makes this
  page read as a landing rather than as the first article on a site.
-->
<main id="main">

  <!--
    The backdrop: a faint grid and a scatter of particles, both fixed behind the
    page and both decorative, so neither is in the accessibility tree.

    Sixteen spans rather than a generated texture, for the same reason the dot
    grid on /about is spans: each one carries its own position, size, delay and
    duration as custom properties, so the scatter is authored rather than
    tiled — a tiled star field repeats, and at this density the eye finds the
    repeat immediately.
  -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-grid"></div>
    <div class="backdrop-glow"></div>
    <span class="particle" style="--x:8%;--y:18%;--s:2px;--o:.5;--d:0s;--t:9s"></span>
    <span class="particle" style="--x:16%;--y:64%;--s:1px;--o:.4;--d:1.4s;--t:11s"></span>
    <span class="particle" style="--x:23%;--y:33%;--s:3px;--o:.32;--d:3.1s;--t:13s"></span>
    <span class="particle" style="--x:31%;--y:82%;--s:2px;--o:.45;--d:2.2s;--t:10s"></span>
    <span class="particle" style="--x:38%;--y:9%;--s:1px;--o:.55;--d:4.6s;--t:12s"></span>
    <span class="particle" style="--x:44%;--y:47%;--s:2px;--o:.3;--d:0.7s;--t:14s"></span>
    <span class="particle" style="--x:52%;--y:73%;--s:1px;--o:.5;--d:5.3s;--t:9.5s"></span>
    <span class="particle" style="--x:58%;--y:22%;--s:3px;--o:.28;--d:2.8s;--t:12.5s"></span>
    <span class="particle" style="--x:64%;--y:56%;--s:1px;--o:.42;--d:6.1s;--t:10.5s"></span>
    <span class="particle" style="--x:71%;--y:88%;--s:2px;--o:.36;--d:1.1s;--t:13.5s"></span>
    <span class="particle" style="--x:77%;--y:14%;--s:2px;--o:.5;--d:3.7s;--t:11.5s"></span>
    <span class="particle" style="--x:83%;--y:41%;--s:1px;--o:.46;--d:0.3s;--t:9.8s"></span>
    <span class="particle" style="--x:88%;--y:69%;--s:3px;--o:.26;--d:4.2s;--t:14.5s"></span>
    <span class="particle" style="--x:93%;--y:28%;--s:1px;--o:.52;--d:5.8s;--t:10.2s"></span>
    <span class="particle" style="--x:96%;--y:79%;--s:2px;--o:.34;--d:2.5s;--t:12.8s"></span>
    <span class="particle" style="--x:5%;--y:92%;--s:1px;--o:.44;--d:6.6s;--t:11.2s"></span>
  </div>

  <section class="landing wrap">

    <div class="landing-copy">
      <p class="landing-mark" aria-hidden="true">1%</p>

      <!-- Three lines, three words each at most, and they are the whole product:
           what you bring, what you get, how often. Everything that used to sit
           under this — how the steps are written, what happens when you miss a
           day, what it costs — is on /about now. A landing page that answers
           questions nobody has asked yet is a landing page nobody finishes. -->
      <h1 class="landing-display">One goal.<br>One step.<br>Every day.</h1>

      <p class="landing-sub">Say what you want to get better at. Every day 1% gives you one small step toward it — five to twenty minutes, specific enough to start now.</p>

      <!-- Apple's official black badge, served from this origin: hotlinking
           Apple's copy is the one external request this site would make, and it
           is not permitted either. The number is the app's Apple ID; no country
           code, because apps.apple.com sends each visitor to their own
           storefront. 156 x 52 CSS px is the standard size for the 119.664 x 40
           pt master, and the dimensions are on the img so the space is reserved
           before the SVG loads and nothing jumps. -->
      <div class="landing-cta">
        <a href="https://apps.apple.com/app/id6795155258" class="badge-link">
          <img src="app-store-badge.svg" width="156" height="52"
               alt="Download 1% on the App Store">
        </a>
      </div>

      <nav class="landing-nav" aria-label="Site">
        <ul>
          <li><a href="/about">About</a></li>
          <li><a href="/privacy">Privacy</a></li>
          <li><a href="/terms">Terms</a></li>
          <li><a href="/support">Support</a></li>
          <li><a href="/imprint">Imprint</a></li>
        </ul>
      </nav>
    </div>

    <!-- The device render rather than the App Store screenshot.

         The store asset is a composed marketing image: it carries its own black
         card behind the phone and its own caption baked into the top of it. Both
         were things this page then had to work around — the caption was cropped
         off in CSS and the card sat on the canvas as a visible rectangle. This
         one is the phone on transparency, so the backdrop runs behind it and the
         shadow is cast by the phone rather than by a box.

         Eager and high priority: it is the only image above the fold and the
         page is otherwise text. -->
    <div class="landing-art">
      <img src="hero-device.png" width="851" height="1849" fetchpriority="high"
           alt="An iPhone showing the Today screen: “Good afternoon, Luis” above the goal “be more present”, then one card marked 5 min — sit or lie with eyes closed and count five full breaths, note which felt longest — with the line “Counting anchors attention to your breath rhythm” under it. Below the card: hold to complete, pull down to swap, and a row of seven dots for the week."></div>

  </section>

</main>
